<!DOCTYPE html>
<html>

<head>
    <title>The Pet Shop</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="CSS/style.css">
    <meta name="description"
        content="The Pet Shop is a local pet store that sells cats, dogs, birds, fish, and reptiles.">
</head>

<body>
    <!--NAVBAR-->

    <nav class="nav-bar">
        <ul id="nav-border">
            <li><a href="Index.html">HOME</a></li>
            <li><a href="contact.html">CONTACT</a></li>
        </ul>
        <ul>
            <a href="#cat">
                <li>Cats & Kittens</li>
            </a>
            <a href="#dog">
                <li>Dogs & Puppies</li>
            </a>
            <a href="#bird">
                <li>Birds</li>
            </a>
            <a href="#fish">
                <li>Fish</li>
            </a>
            <a href="#reptile">
                <li>Reptiles</li>
            </a>
        </ul>
    </nav>
    <!--HEADER-->
    <header>
        <div>
            <h1 class="animate-text">Welcome to The Pet Shop!</h1>
        </div>
    </header>
    <!--Pet Images-->
    <section>
        <div class="container">
            <h2>Choose a Pet!</h2>
            <div>
                <!--Cat Image-->
                <div id="cat" class="column">
                    <div class="image-container">
                        <h3>Cats & Kittens</h3>
                        <img src="images/cat.jpg" alt="Picture of kittens">
                        <div class="overlay"></div>
                    </div>
                </div>
                <!--Dog Image-->
                <div id="dog" class="column">
                    <div class="image-container">
                        <h3>Dogs & Puppies</h3>
                        <img src="images/dog.jpg" alt="picture of dogs"><div class="overlay"></div>
                        <div class="overlay"></div>
                    </div>
                </div>
                <!--Bird Image-->
                <div id="bird" class="column">
                    <div class="image-container">
                        <h3>Birds</h3>
                        <img src="images/parrot.jpg" alt="picture of bird">
                        <div class="overlay"></div>
                    </div>
                </div>
                <!--Fish Image-->
                <div id="fish" class="column">
                    <div class="image-container">
                        <h3>Fish</h3>
                        <img src="images/goldfish.jpg" alt="picture of fish">
                        <div class="overlay"></div>
                    </div>
                </div>
                <!--Reptile Image-->
                <div id="reptile" class="column">
                    <div class="image-container">
                        <h3>Reptiles</h3>
                        <img src="images/turtle.jpg" alt="picture of turtle">
                        <div class="overlay"></div>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <!--Footer-->
    <footer>
        <table>
            <tr>
                <td>
                    <p>The Pet Shop! &copy;</p>
                </td>
                <td>
                    <p>123 Square Ave</p>
                    <p>Portland, OR 97204</p>
                </td>
                <td>
                    <p>503-555-1234</p>
                </td>
            </tr>
        </table>
    </footer>
</body>

</html>
